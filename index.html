<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление ИИ-Модератором</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        h2, h3 {
            margin-top: 0;
        }
        /* Карточка статуса подписки */
        .sub-card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* Кнопки */
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
        }
        .btn-stars {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        /* Карточки каналов/чатов */
        .chat-card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .chat-info p {
            margin: 0;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #aaaaaa);
        }
        .toggle-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .enabled {
            background-color: #27ae60;
            color: white;
        }
        .disabled {
            background-color: #c0392b;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Блок статуса подписки и слотов владельца -->
    <div id="subscription-card" class="sub-card">
        <h3>📊 Статус PRO-подписки</h3>
        <p id="sub-status">Загрузка данных...</p>
        <p id="slots-status">Слоты: --</p>
        <button class="btn btn-stars" onclick="buySubscription()">
            ⭐ Купить пакет (+3 чата) — 100 Stars
        </button>
    </div>

    <!-- Список чатов пользователя -->
    <h3>Ваши чаты и каналы</h3>
    <div id="chats-container">
        <p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка списка чатов...</p>
    </div>

    <script>
    const BACKEND_URL = "https://censorshipingbot.onrender.com";
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Получаем криптографически подписанные данные запуска Mini App
    const initData = tg.initData;

    // Общая функция для выполнения запросов с авторизацией
    async function apiRequest(endpoint, method = 'GET', body = null) {
        if (!initData) {
            tg.showAlert('Ошибка: приложение запущено вне Telegram!');
            throw new Error('No initData available');
        }

        const headers = {
            'Authorization': `tma ${initData}`,
            'Content-Type': 'application/json'
        };

        const options = { method, headers };
        if (body) {
            options.body = JSON.stringify(body);
        }

        const response = await fetch(`${BACKEND_URL}${endpoint}`, options);
        return await response.json();
    }

    // 1. Загрузка данных о подписке и слотах
    function loadUserSubscription() {
        apiRequest('/api/get_user_sub')
            .then(data => {
                if (data.status === 'success') {
                    const subText = data.is_active ? `🟢 PRO активен до: ${data.expires_at}` : `🔴 PRO не активен`;
                    document.getElementById('sub-status').innerText = subText;
                    document.getElementById('slots-status').innerText = `Использовано каналов: ${data.active_chats} из ${data.max_slots}`;
                } else {
                    document.getElementById('sub-status').innerText = "Не удалось загрузить статус подписки";
                }
            })
            .catch(err => {
                console.error("Ошибка загрузки подписки:", err);
                document.getElementById('sub-status').innerText = "Ошибка связи с сервером";
            });
    }

    // 2. Загрузка списка чатов пользователя
    function loadUserChats() {
        apiRequest('/api/get_chats')
            .then(data => {
                const container = document.getElementById('chats-container');
                container.innerHTML = '';

                // ДОБАВЛЕННЫЙ БЛОК: показываем реальную ошибку сервера
                if (data.status === 'error') {
                    container.innerHTML = `<p style="color: #e74c3c;">Ошибка сервера: ${data.error}</p>`;
                    return;
                }

                if (!data.chats || data.chats.length === 0) {
                    container.innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">У вас пока нет подключенных чатов или каналов.</p>';
                    return;
                }
                
                // ... дальше идет старый код data.chats.forEach ...


                data.chats.forEach(chat => {
                    const card = document.createElement('div');
                    card.className = 'chat-card';

                    const statusClass = chat.ai_enabled ? 'enabled' : 'disabled';
                    const statusText = chat.ai_enabled ? 'Включен' : 'Выключен';

                    card.innerHTML = `
                        <div class="chat-info">
                            <h4>${chat.chat_title || 'Без названия'}</h4>
                            <p>ID: ${chat.chat_id}</p>
                        </div>
                        <button class="toggle-btn ${statusClass}" onclick="toggleAiForChat('${chat.chat_id}')">
                            ${statusText}
                        </button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error("Ошибка загрузки чатов:", err);
                document.getElementById('chats-container').innerHTML = '<p style="color: #e74c3c;">Ошибка загрузки списка чатов.</p>';
            });
    }

    // 3. Переключение ИИ для конкретного чата
    function toggleAiForChat(chatId) {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        // Передаем только chat_id — owner_id сервер определит сам из initData
        apiRequest('/api/toggle_ai', 'POST', { chat_id: String(chatId) })
            .then(data => {
                if (data.status === 'success') {
                    tg.showAlert(data.ai_enabled ? 'ИИ-модератор успешно включен!' : 'ИИ-модератор выключен.');
                    loadUserSubscription();
                    loadUserChats();
                } else {
                    tg.showAlert('⚠️ ' + (data.error || 'Не удалось переключить ИИ'));
                }
            })
            .catch(error => {
                tg.showAlert('Ошибка соединения с сервером');
            });
    }

    // 4. Покупка пакета за Telegram Stars
    function buySubscription() {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        apiRequest('/api/create_stars_invoice', 'POST', {})
            .then(data => {
                if (data.status === 'success' && data.invoice_link) {
                    tg.openInvoice(data.invoice_link, function(status) {
                        if (status === 'paid') {
                            tg.showAlert('🎉 Пакет успешно куплен! Добавлено +3 слота.');
                            loadUserSubscription();
                            loadUserChats();
                        }
                    });
                } else {
                    tg.showAlert('Ошибка создания счета: ' + (data.error || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                tg.showAlert('Ошибка соединения с сервером');
            });
    }

    // Инициализация при открытии приложения
    loadUserSubscription();
    loadUserChats();
</script>

</body>
</html>
