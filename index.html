<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление ИИ-Модератором</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        h2, h3 { margin-top: 0; }
        
        .sub-card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
        }
        .btn-stars { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-admin { background: linear-gradient(135deg, #8e44ad, #9b59b6); } /* Фиолетовая админская кнопка */

        .back-btn {
            background: transparent;
            color: var(--tg-theme-button-color, #2481cc);
            border: none;
            font-size: 16px;
            padding: 0;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .chat-card {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .chat-card.clickable:active { opacity: 0.7; }
        
        .chat-info h4 { margin: 0 0 4px 0; font-size: 16px; }
        .chat-info p { margin: 0; font-size: 13px; color: var(--tg-theme-hint-color, #aaaaaa); }
        
        .toggle-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .enabled { background-color: #27ae60; color: white; }
        .disabled { background-color: #c0392b; color: white; }

        /* Стили для логов */
        .log-item {
            background: var(--tg-theme-secondary-bg-color, #222222);
            border-left: 4px solid var(--tg-theme-button-color, #2481cc);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .log-date { font-size: 12px; color: var(--tg-theme-hint-color, #aaaaaa); font-weight: normal; }
        .log-reason { color: #e74c3c; font-size: 13px; margin-top: 4px; }
        .badge-premium { background: #f1c40f; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-base { background: #7f8c8d; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Экран 1: Главный список -->
    <div id="main-view">
        <div id="subscription-card" class="sub-card">
            <h3>📊 Статус PRO-подписки</h3>
            <p id="sub-status">Загрузка данных...</p>
            <p id="slots-status">Слоты: --</p>
            <button class="btn btn-stars" onclick="buySubscription()">
                ⭐ Купить пакет (+3 чата) — 100 Stars
            </button>
            <!-- Сюда динамически добавится кнопка админа -->
        </div>

        <h3>Ваши чаты и каналы</h3>
        <div id="chats-container">
            <p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка списка чатов...</p>
        </div>
    </div>

    <!-- Экран 2: Детали конкретного чата -->
    <div id="detail-view" style="display: none;">
        <button class="back-btn" onclick="showMainView()">⬅ Назад к списку</button>
        
        <div class="sub-card" style="margin-top: 10px;">
            <h3 id="detail-title" style="margin-bottom: 15px;">Загрузка...</h3>
            <p><b>Дата добавления:</b> <span id="detail-added">...</span></p>
            <p><b>Тариф:</b> <span id="detail-premium">...</span></p>
            <p><b>ИИ-Модерация:</b> <span id="detail-ai">...</span></p>
        </div>

        <h3>Последние действия (до 20)</h3>
        <div id="logs-container">
            <p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка логов...</p>
        </div>
    </div>

    <!-- Экран 3: ПАНЕЛЬ АДМИНИСТРАТОРА -->
    <div id="admin-view" style="display: none;">
        <button class="back-btn" onclick="showMainView()">⬅ Назад в кабинет</button>
        
        <div class="sub-card" style="margin-top: 10px;">
            <h3 style="margin-bottom: 5px;">👑 Панель Администратора</h3>
            <p style="font-size: 13px; color: var(--tg-theme-hint-color, #aaa); margin: 0;">Мониторинг всех чатов в системе</p>
        </div>

        <div id="admin-chats-container">
            <p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка всех чатов...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://censorshipingbot.onrender.com"; 
        const tg = window.Telegram.WebApp;
        tg.expand();

        const initData = tg.initData;

        async function apiRequest(endpoint, method = 'GET', body = null) {
            if (!initData) {
                tg.showAlert('Ошибка: приложение запущено вне Telegram!');
                throw new Error('No initData available');
            }
            const headers = { 'Authorization': `tma ${initData}`, 'Content-Type': 'application/json' };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(`${BACKEND_URL}${endpoint}`, options);
            return await response.json();
        }

        // --- НАВИГАЦИЯ ---
        function showMainView() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            loadUserChats();
        }

        function showDetailView() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
        }
        
        function showAdminView() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('admin-view').style.display = 'block';
        }

        // --- ЛОГИКА КАБИНЕТА ---
        function loadUserSubscription() {
            apiRequest('/api/get_user_sub').then(data => {
                if (data.status === 'success') {
                    document.getElementById('sub-status').innerText = data.is_active ? `🟢 PRO активен до: ${data.expires_at}` : `🔴 PRO не активен`;
                    document.getElementById('slots-status').innerText = `Использовано каналов: ${data.active_chats} из ${data.max_slots}`;
                    
                    // Показываем кнопку админа, если бэкенд дал добро
                    if (data.is_admin && !document.getElementById('admin-btn')) {
                        const adminBtn = document.createElement('button');
                        adminBtn.id = 'admin-btn';
                        adminBtn.className = 'btn btn-admin';
                        adminBtn.innerText = '👑 Панель Администратора';
                        adminBtn.onclick = openAdminPanel;
                        document.getElementById('subscription-card').appendChild(adminBtn);
                    }
                }
            }).catch(err => console.error(err));
        }

        function loadUserChats() {
            apiRequest('/api/get_chats').then(data => {
                const container = document.getElementById('chats-container');
                container.innerHTML = '';

                if (data.status === 'error') {
                    container.innerHTML = `<p style="color: #e74c3c;">Ошибка: ${data.error}</p>`;
                    return;
                }
                if (!data.chats || data.chats.length === 0) {
                    container.innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">У вас пока нет подключенных чатов.</p>';
                    return;
                }

                data.chats.forEach(chat => {
                    const card = document.createElement('div');
                    card.className = 'chat-card clickable';
                    const statusClass = chat.ai_enabled ? 'enabled' : 'disabled';
                    const statusText = chat.ai_enabled ? 'Включен' : 'Выключен';

                    card.innerHTML = `
                        <div class="chat-info" onclick="openChatDetails('${chat.chat_id}')" style="cursor: pointer; flex-grow: 1;">
                            <h4>${chat.chat_title || 'Без названия'}</h4>
                            <p>ID: ${chat.chat_id}</p>
                        </div>
                        <button class="toggle-btn ${statusClass}" onclick="toggleAiForChat('${chat.chat_id}')">
                            ${statusText}
                        </button>
                    `;
                    container.appendChild(card);
                });
            }).catch(err => console.error(err));
        }

        function toggleAiForChat(chatId) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            apiRequest('/api/toggle_ai', 'POST', { chat_id: String(chatId) }).then(data => {
                if (data.status === 'success') {
                    tg.showAlert(data.ai_enabled ? 'ИИ-модератор включен!' : 'ИИ-модератор выключен.');
                    loadUserSubscription();
                    loadUserChats();
                } else {
                    tg.showAlert('⚠️ ' + (data.error || 'Ошибка'));
                }
            }).catch(err => tg.showAlert('Ошибка соединения'));
        }

        function buySubscription() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            apiRequest('/api/create_stars_invoice', 'POST', {}).then(data => {
                if (data.status === 'success' && data.invoice_link) {
                    tg.openInvoice(data.invoice_link, function(status) {
                        if (status === 'paid') {
                            tg.showAlert('🎉 Пакет куплен!');
                            loadUserSubscription();
                            loadUserChats();
                        }
                    });
                } else {
                    tg.showAlert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            });
        }

        // --- ДЕТАЛИ ЧАТА ---
        function openChatDetails(chatId) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            showDetailView();
            document.getElementById('detail-title').innerText = "Загрузка...";
            document.getElementById('logs-container').innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка логов...</p>';

            apiRequest(`/api/chat_details?chat_id=${chatId}`).then(data => {
                if (data.status === 'success') {
                    document.getElementById('detail-title').innerText = data.title;
                    document.getElementById('detail-added').innerText = data.added_at;
                    document.getElementById('detail-premium').innerHTML = data.is_premium ? '<span class="badge-premium">PRO</span>' : '<span class="badge-base">Базовый</span>';
                    document.getElementById('detail-ai').innerText = data.ai_enabled ? 'Включена 🟢' : 'Выключена 🔴';

                    const logsContainer = document.getElementById('logs-container');
                    logsContainer.innerHTML = '';

                    if (!data.logs || data.logs.length === 0) {
                        logsContainer.innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">В этом чате пока нет нарушений. Всё чисто! ✨</p>';
                        return;
                    }

                    data.logs.forEach(log => {
                        const item = document.createElement('div');
                        item.className = 'log-item';
                        
                        // 1. ПЕРЕВОД ДЕЙСТВИЙ (action)
                        let actionFormatted = log.action;
                        if (actionFormatted === 'deleted') actionFormatted = 'Удалено сообщение';
                        else if (actionFormatted === 'muted') actionFormatted = 'Выдан мут';
                        else if (actionFormatted.includes('warn_1')) actionFormatted = 'Предупреждение (1/3)';
                        else if (actionFormatted.includes('warn_2')) actionFormatted = 'Мут 5 минут (2/3)';
                        else if (actionFormatted.includes('warn_3')) actionFormatted = 'Мут 1 час (3/3)';

                        // 2. ПЕРЕВОД ПРИЧИН (reason)
                        let reasonFormatted = log.reason;
                        if (reasonFormatted === 'spam') reasonFormatted = 'Спам / Реклама';
                        else if (reasonFormatted === 'toxic') reasonFormatted = 'Токсичность / Оскорбления';
                        else if (reasonFormatted === 'obscene') reasonFormatted = 'Ненормативная лексика';
                        else if (reasonFormatted === 'obscene_basic' || reasonFormatted === 'obscene (словарный фильтр)') reasonFormatted = 'Мат (словарный фильтр)';

                        // 3. ОТРИСОВКА
                        let localDateStr = "Неизвестно";
                        if (log.date) {
                            // Телефон сам переведет время в нужный часовой пояс админа
                            let dateObj = new Date(log.date);
                            let dayMonth = dateObj.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                            let time = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                            localDateStr = `${dayMonth} ${time}`;
                        }

                        let textPreview = log.message_text ? `<div style="font-size: 13px; color: #666; font-style: italic; margin-top: 4px; margin-bottom: 2px;">💬 "${log.message_text}"</div>` : '';

                        item.innerHTML = `
                            <div class="log-header">
                                <span>👤 ${log.user_name}</span>
                                <span class="log-date">${localDateStr}</span>
                            </div>
                            <div style="font-size: 13px;"><b>Действие:</b> ${actionFormatted}</div>
                            ${textPreview}
                            <div class="log-reason"><b>Причина:</b> ${reasonFormatted}</div>
                        `;
                        logsContainer.appendChild(item);
                    });


                } else {
                    tg.showAlert('Ошибка: ' + data.error);
                    showMainView();
                }
            }).catch(err => {
                tg.showAlert('Ошибка загрузки данных чата');
                showMainView();
            });
        }


        // --- ЛОГИКА ПАНЕЛИ АДМИНА ---
        function openAdminPanel() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            showAdminView();
            
            const container = document.getElementById('admin-chats-container');
            container.innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">Загрузка аналитики...</p>';

            apiRequest('/api/admin/all_chats').then(data => {
                container.innerHTML = '';
                
                if (data.status === 'error') {
                    container.innerHTML = `<p style="color: #e74c3c;">Ошибка доступа: ${data.error}</p>`;
                    return;
                }
                
                if (!data.chats || data.chats.length === 0) {
                    container.innerHTML = '<p style="color: var(--tg-theme-hint-color, #aaa);">В системе пока нет активных чатов.</p>';
                    return;
                }

                data.chats.forEach(chat => {
                    const card = document.createElement('div');
                    card.className = 'chat-card'; // Без класса clickable
                    const statusClass = chat.ai_enabled ? 'enabled' : 'disabled';
                    const statusText = chat.ai_enabled ? 'Вкл' : 'Выкл';

                    // Карточка для админа только для просмотра (без перехода внутрь)
                    card.innerHTML = `
                        <div class="chat-info" style="flex-grow: 1;">
                            <h4>${chat.chat_title}</h4>
                            <p>ID: ${chat.chat_id}</p>
                            <p>Запросов ИИ: <b style="color: var(--tg-theme-button-color, #2481cc);">${chat.ai_requests}</b></p>
                        </div>
                        <span class="toggle-btn ${statusClass}" style="cursor: default; font-size: 12px; padding: 6px 10px;">
                            ${statusText}
                        </span>
                    `;
                    container.appendChild(card);
                });
            }).catch(err => {
                container.innerHTML = '<p style="color: #e74c3c;">Ошибка загрузки</p>';
                console.error(err);
            });
        }

        // Инициализация
        loadUserSubscription();
        loadUserChats();
    </script>
</body>
</html>
